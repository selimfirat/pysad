[aliases]
test = pytest

[tool:pytest]
addopts = --verbose -m "not examples"
markers =
    examples: runs the scripts in examples/ end to end (slow, run with -m examples)

[coverage:run]
source=pysad
omit=pysad/_demos/*
     setup.py
     _build_readme.py

[pycodestyle]
ignore = E501

[flake8]
ignore = E501
exclude = .git,__pycache__,docs/conf.py,old,build,dist,pysad/models/kitnet_model,tests,setup.py