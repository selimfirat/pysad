name: greetings

# Thanks people the first time they open an issue or a pull request in this repository.
on:
  issues:
    types: [opened]
  # pull_request_target runs in the base repository's context so the token can comment on
  # pull requests from forks. Nothing from the pull request is checked out or executed,
  # which is why zizmor's dangerous-triggers finding is ignored here.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened]

permissions:
  contents: read

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Greet first-time contributor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const isPr = context.eventName === 'pull_request_target' || context.eventName === 'pull_request';
            const payload = isPr ? context.payload.pull_request : context.payload.issue;
            if (!payload || !payload.user) {
              return;
            }

            const author = payload.user.login;
            const currentNumber = payload.number;

            let hasPrior = false;
            await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                creator: author,
                state: 'all',
                per_page: 100,
              },
              (response, done) => {
                for (const item of response.data) {
                  const itemIsPr = Boolean(item.pull_request);
                  if (itemIsPr === isPr && item.number < currentNumber) {
                    hasPrior = true;
                    done();
                    return [];
                  }
                }
                return [];
              }
            );

            if (hasPrior) {
              core.info(`Author @${author} has prior ${isPr ? 'pull requests' : 'issues'}; skipping greeting.`);
              return;
            }

            const message = isPr
              ? 'Thanks for your first pull request to PySAD! CI will run the tests shortly.\n' +
                'Please make sure the change comes with a test and, for new features or models,\n' +
                'a note in `CHANGES.txt`. See `.github/CONTRIBUTING.md` for the full checklist.'
              : 'Thanks for opening your first issue in PySAD! A maintainer will take a look soon.\n' +
                'In the meantime, please make sure the issue includes the PySAD version, a short\n' +
                'code snippet that reproduces the problem, and the full traceback if there is one.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: currentNumber,
              body: message,
            });
            core.info(`Welcomed @${author} on their first ${isPr ? 'pull request' : 'issue'} (#${currentNumber}).`);
