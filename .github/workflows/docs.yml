name: docs

# Builds the Sphinx documentation the same way Read the Docs does (.readthedocs.yaml:
# Python 3.10, the runtime and docs dependency groups, docs/conf.py) so a broken docs build fails the
# pull request instead of surfacing on Read the Docs after the merge.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a group per PR (so stale pushes get cancelled); every push gets its own group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Matches build.tools.python in .readthedocs.yaml.
          python-version: "3.10"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        # Same dependency groups as python.install in .readthedocs.yaml. The package itself
        # is not installed; docs/conf.py puts the repository root on sys.path.
        run: uv pip install --system --group runtime --group docs
      - name: Build documentation
        # -W turns warnings into errors and --keep-going reports all of them in one run.
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Upload built documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
