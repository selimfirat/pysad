<title id="t">PySAD vs River, CapyMOA, and PyOD: throughput and AUROC on 17 ODDS datasets</title>
<desc id="d">Scatter plot comparing streaming multivariate anomaly detectors across PySAD, River 0.26.1, CapyMOA 0.15.1, and PyOD 3.6.7 wrapped with ReferenceWindowModel on the same hardware across 17 ODDS datasets. X-axis shows log-scale throughput in points per second; Y-axis shows mean AUROC.</desc>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.title{fill:#eef1f8;font-size:14px;font-weight:600}.cue,.legend-text{fill:#a3adc2;font-size:12px}.axis-label{fill:#a3adc2;font-size:12px;font-weight:500}.tick{fill:#a3adc2;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}.grid{stroke:#2a3a5c;stroke-width:1}.chance{stroke:#64748b;stroke-width:1;stroke-dasharray:4 4}.chance-text{fill:#a3adc2;font-size:11px}.frontier{stroke:#7c9ff0;stroke-width:1.4;stroke-dasharray:5 4;opacity:0.45;fill:none}.leader{stroke:#a3adc2;stroke-width:1;opacity:0.45}.m-pysad{fill:#7c9ff0}.m-river{fill:#2dd4bf}.m-capymoa{fill:#f59e0b}.m-pyod{fill:none;stroke:#94a3b8;stroke-width:2}.lbl-pysad{fill:#7c9ff0;font-size:11.5px;font-weight:600}.lbl-other{fill:#a3adc2;font-size:11px;font-weight:500}</style>
