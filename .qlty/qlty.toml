config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # Vendored KitNET reference implementation.
  "pysad/models/kitnet_model/**",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

# pytest relies on plain asserts, which bandit reports as B101.
[[exclude]]
plugins = ["bandit"]
file_patterns = ["tests/**"]

# Known false positives, silenced so the report only shows actionable issues.

# setup.py and docs/conf.py exec pysad/version.py to read __version__ without importing pysad.
[[triage]]
match.rules = ["ruff:F821", "bandit:B102"]
match.file_patterns = ["setup.py", "docs/conf.py"]
set.ignored = true

# Warning filters must be installed before the subpackages are imported.
[[triage]]
match.rules = ["ruff:E402"]
match.file_patterns = ["pysad/__init__.py"]
set.ignored = true

# Package __init__ modules import names to re-export them, including the optional Inqmad.
[[triage]]
match.rules = ["ruff:F401"]
match.file_patterns = ["**/__init__.py"]
set.ignored = true

# X is the scikit-learn convention for a data matrix.
[[triage]]
match.rules = ["radarlint-python:python:S117", "radarlint-python:python:S1542"]
set.ignored = true

# xStream is part of the public API.
[[triage]]
match.rules = ["radarlint-python:python:S101"]
match.file_patterns = ["pysad/models/xstream.py"]
set.ignored = true

# Tests compare exact expected values, and LODA checks for a bin width of exactly zero.
[[triage]]
match.rules = ["radarlint-python:python:S1244"]
match.file_patterns = ["tests/**", "pysad/models/loda.py"]
set.ignored = true

# Test names and docstrings, not credentials.
[[triage]]
match.plugins = ["trufflehog"]
match.file_patterns = ["tests/**"]
set.ignored = true

# The single-quoted $names are GraphQL variables, not shell expansions.
[[triage]]
match.rules = ["shellcheck:2016"]
match.file_patterns = [".github/scripts/release_contributors.sh"]
set.ignored = true

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
