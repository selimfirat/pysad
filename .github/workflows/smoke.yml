name: smoke tests

# Builds the PySAD core wheel and installs it into clean virtual environments.
# The checks cover the core wheel, the mcp extra, and the fast extra.
# The fast extra check builds pysad_kernels on Linux, macOS, and Windows.
# No core dependencies are added to pyproject.toml.
on:
  push:
    branches: [master]
    paths:
      - "pysad/**"
      - "rust/**"
      - "pyproject.toml"
      - ".github/workflows/smoke.yml"
  pull_request:
    paths:
      - "pysad/**"
      - "rust/**"
      - "pyproject.toml"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
        extra: ["", "mcp"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: smoke-${{ matrix.extra }}
          prune-cache: true

      - name: Build the core wheel
        run: |
          rm -rf dist
          uv build --wheel --out-dir dist

      - name: Create a clean environment
        run: python -m venv .venv

      - name: Install the built wheel
        run: |
          set -- dist/pysad-*.whl
          WHL=$1
          . .venv/bin/activate
          python -m pip install --upgrade "pip==26.3"
          if [ "${SMOKE_EXTRA}" = "mcp" ]; then
            python -m pip install "${WHL}[mcp]"
          else
            python -m pip install "$WHL"
          fi
        env:
          SMOKE_EXTRA: ${{ matrix.extra }}

      - name: Verify public imports
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import os

          import numpy as np

          import pysad
          assert pysad.__version__

          from pysad.models import HalfSpaceTrees, LODA, xStream
          from pysad.transform.ensemble import AverageScoreEnsembler
          from pysad.statistics import AverageMeter
          from pysad.utils import ArrayStreamer, Data, fix_seed
          from pysad.evaluation import evaluate_stream

          import pysad.core
          import pysad.live
          import pysad.live.server
          import pysad.utils

          # One real score call proves the installed wheel works, not just imports.
          detector = LODA()
          score = detector.fit_score_partial(np.array([0.1, 0.2, 0.3]))
          assert isinstance(score, float)

          if os.environ.get("SMOKE_EXTRA") == "mcp":
              from pysad.mcp.server import create_mcp_server

              create_mcp_server()

          print("smoke: public imports and a score call OK")
          PY
        env:
          SMOKE_EXTRA: ${{ matrix.extra }}

      - name: Verify pysad-live CLI
        run: |
          . .venv/bin/activate
          # The console script entry point must be installed from the wheel.
          pysad-live --help > "$RUNNER_TEMP/live-help.txt"
          # Headless run exercises the detector, calibrator, and JSON output.
          pysad-live --source synthetic --detector loda --calibrator conformal --json-output --max-points 2 > "$RUNNER_TEMP/live.jsonl"
          python - "$RUNNER_TEMP" <<'PY'
          import json, os, sys
          tmp = sys.argv[1]
          lines = open(os.path.join(tmp, "live.jsonl")).readlines()
          assert lines, "pysad-live produced no output"
          last = json.loads(lines[-1])
          assert {"step", "calibrated_score", "alert"} <= set(last), last
          print("pysad-live: CLI OK; headless run produced", len(lines), "lines")
          PY

  fast-extra:
    name: Install fast extra (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: smoke-fast-${{ matrix.os }}-${{ matrix.python-version }}
          prune-cache: true

      - name: Build the core wheel
        shell: bash
        run: |
          rm -rf dist
          uv build --wheel --out-dir dist

      - name: Build the kernel wheel
        run: uv build rust --wheel --out-dir wheelhouse

      - name: Install the fast extra
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=.venv/Scripts/python.exe
          else
            PYTHON=.venv/bin/python
          fi
          "$PYTHON" -m pip install --upgrade pip
          set -- dist/pysad-*.whl
          "$PYTHON" -m pip install --only-binary=pysad_kernels --find-links wheelhouse "${1}[fast]"

      - name: Verify the native kernels
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=.venv/Scripts/python.exe
          else
            PYTHON=.venv/bin/python
          fi
          "$PYTHON" - <<'PY'
          import numpy as np

          import pysad_kernels
          from pysad.models import HalfSpaceTrees

          assert callable(pysad_kernels.half_space_trees_path)
          assert callable(pysad_kernels.rrcf_route_to_leaf)
          assert callable(pysad_kernels.rrcf_codisp_sum)

          detector = HalfSpaceTrees(
              feature_mins=np.zeros(2),
              feature_maxes=np.ones(2),
              window_size=4,
              num_trees=2,
              max_depth=2,
              random_state=0,
          )
          score = detector.fit_score_partial(np.array([0.5, 0.5]))
          assert isinstance(score, float)

          print("fast extra: native kernels and a score call OK")
          PY
