name: docs

# Builds the Sphinx documentation the same way Read the Docs does (.readthedocs.yaml:
# Python 3.10, requirements-dev.txt, docs/conf.py) so a broken docs build fails the
# release pull request instead of surfacing on Read the Docs after the merge.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a group per PR (so stale pushes get cancelled); every push gets its own group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    # Only release/vX.Y.Z pull requests, the same branches publish.yml tags and releases.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Matches build.tools.python in .readthedocs.yaml.
          python-version: "3.10"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-dev.txt"
      - name: Install dependencies
        # Same requirements file as python.install in .readthedocs.yaml. The package itself
        # is not installed; docs/conf.py puts the repository root on sys.path like Read the Docs does.
        run: uv pip install --system -r requirements-dev.txt
      - name: Build documentation
        # -W turns warnings into errors and --keep-going reports all of them in one run.
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Upload built documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
