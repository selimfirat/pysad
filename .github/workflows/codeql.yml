name: codeql

# Runs GitHub CodeQL static analysis on the Python package and on the workflow
# files themselves. Results appear in the repository's Security tab.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "pysad/**"
      - ".github/**"
      - "benchmarks/**"
      - "scripts/**"
      - "spaces/**"
      - "docs/*.py"
      - "pyproject.toml"
  schedule:
    # Weekly, so new queries also run against code that has not changed.
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a group per PR (so stale pushes get cancelled); every other run gets its own group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.plan.outputs.languages }}
      has_languages: ${{ steps.plan.outputs.has_languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select affected CodeQL languages
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            python3 scripts/ci_affected.py codeql "origin/$BASE_REF" > "$RUNNER_TEMP/codeql-plan.json"
            python3 -c '
          import json, os
          from pathlib import Path
          plan = json.loads(Path(os.environ["RUNNER_TEMP"], "codeql-plan.json").read_text(encoding="utf-8"))
          langs = plan["languages"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("languages=" + json.dumps(langs, separators=(",", ":")) + "\n")
              f.write("has_languages=" + ("true" if langs else "false") + "\n")
          '
          else
            {
              echo 'languages=["python","actions"]'
              echo 'has_languages=true'
            } >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: plan
    if: needs.plan.outputs.has_languages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploads the SARIF results to code scanning.
      security-events: write
      # Lets the analysis read workflow run metadata.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.plan.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # Python and Actions are interpreted, so no build is needed.
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
