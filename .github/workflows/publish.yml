name: Publish

on:
  release:
    types:
      - published
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: read

jobs:
  tag-release:
    name: Tag and create release
    # Runs when a release/vX.Y.Z branch from this repository is merged into master.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read and verify version
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${HEAD_REF#release/}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Branch $HEAD_REF does not name a version" >&2
            exit 1
          fi
          PKG_VERSION=$(python -c "import ast; tree=ast.parse(open('pysad/version.py').read()); node=next(n for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets)); print(ast.literal_eval(node.value))")
          if [ "v$PKG_VERSION" != "$VERSION" ]; then
            echo "pysad/version.py is $PKG_VERSION but branch is $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          NOTES: ${{ github.event.pull_request.body }}
        # Idempotent so a failed PyPI publish can be retried with "Re-run all jobs".
        run: |
          # The peeled "^{}" line of an annotated tag follows the tag line, so the last match is the commit.
          TAG_SHA=$(git ls-remote --tags origin | awk -v t="refs/tags/$VERSION" '$2 == t || $2 == t "^{}" { sha = $1 } END { print sha }')
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$SHA" ]; then
            echo "Tag $VERSION points at $TAG_SHA, not merge commit $SHA" >&2
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ -z "$TAG_SHA" ]; then
              echo "Release $VERSION exists but tag $VERSION does not" >&2
              exit 1
            fi
            echo "Release $VERSION already exists at $SHA; continuing to publish"
            exit 0
          fi
          printf '%s\n' "$NOTES" > release-notes.md
          # Thank everyone who opened a pull request or a fixed issue since the previous tag.
          # This is best effort, so a failure here never blocks the release.
          PREVIOUS=$(git describe --tags --abbrev=0 "$SHA^" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            bash .github/scripts/release_contributors.sh "$PREVIOUS" "$SHA" >> release-notes.md \
              || echo "Could not list contributors since $PREVIOUS; releasing without them" >&2
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md

  build:
    name: Build distribution
    needs: tag-release
    # Releases published by hand take the release path; merged release branches take the tag-release path.
    # A release created by tag-release uses GITHUB_TOKEN, so it does not trigger this workflow again.
    if: >-
      always() &&
      (github.event_name == 'release' || needs.tag-release.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # always() is needed because tag-release (an ancestor) is skipped on the release path.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/pysad/
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
