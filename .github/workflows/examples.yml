name: examples

on:
  push:
    branches: [master]
    paths:
      - "pysad/**"
      - "examples/**"
      - "docs/examples.rst"
      - "tests/test_examples.py"
      - "pyproject.toml"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "pysad/**"
      - "examples/**"
      - "docs/examples.rst"
      - "tests/test_examples.py"
      - "pyproject.toml"
      - ".github/workflows/examples.yml"

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MPLBACKEND: Agg

concurrency:
  # PR runs share a group per PR (so stale pushes get cancelled); every push gets its own group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: examples
          prune-cache: true
      - name: Install dependencies
        run: |
          # uv prefers wheels by default, matching pip's --prefer-binary.
          uv pip install --system --group runtime --group test -e .
      - name: Find affected examples
        id: plan
        if: github.base_ref != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          count=$(python -c 'import os; from tests.test_examples import affected_examples; print(len(affected_examples("origin/" + os.environ["BASE_REF"])))')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      # The examples download their datasets, for example 74 MB of KDD Cup 99 from OpenML.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.base_ref == '' || steps.plan.outputs.count != '0'
        with:
          path: ~/.cache/pysad
          key: pysad-examples-data-${{ hashFiles('pysad/utils/data.py', 'pysad/utils/_datasets.py') }}
          restore-keys: pysad-examples-data-
      - name: Run examples
        if: github.base_ref == '' || steps.plan.outputs.count != '0'
        env:
          BASE_REF: ${{ github.base_ref }}
          COUNT: ${{ steps.plan.outputs.count }}
        run: |
          if [ -n "$BASE_REF" ]; then
            export PYSAD_EXAMPLES_SINCE="origin/$BASE_REF"
          fi
          if [ -n "$COUNT" ] && [ "$COUNT" -le 3 ]; then
            pytest -m examples
          else
            pytest -m examples -n auto --dist worksteal
          fi
