# Dependabot configuration: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # GitHub Actions used in .github/workflows. Actions are pinned to commit
  # SHAs with a version comment; Dependabot updates both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Only propose releases that are at least a week old, so a compromised or broken
    # release is likely caught upstream first. Security updates are not delayed.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python dependencies from pyproject.toml: [project] and the [dependency-groups] pins.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Same one-week cooldown as above.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build"
    groups:
      # Minor and patch bumps land in one PR; majors get their own PR each.
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Keeps the hash-locked release build tools (build, twine) current.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
    # Same one-week cooldown as above.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build"
    groups:
      build-tools:
        patterns:
          - "*"
