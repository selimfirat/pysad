name: deploy hf space

# Syncs spaces/playground to the Hugging Face Space when HF_TOKEN is configured.
on:
  push:
    branches: [master]
    paths:
      - "pysad/**"
      - "spaces/playground/**"
      - ".github/workflows/hf-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Upload Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set; skipping Hugging Face Space sync."
            exit 0
          fi
          uv pip install --system huggingface_hub
          stage_dir="$(mktemp -d)"
          cp spaces/playground/index.html spaces/playground/engine.py spaces/playground/README.md "$stage_dir"/
          mkdir -p "$stage_dir/data/nab"
          cp -r examples/data/nab/. "$stage_dir/data/nab"/
          cp examples/data/arrhythmia.mat "$stage_dir/data/arrhythmia.mat"
          uv build --wheel --out-dir "$stage_dir"
          STAGE_DIR="$stage_dir" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          stage = Path(os.environ["STAGE_DIR"])
          wheels = sorted(p.name for p in stage.glob("pysad-*.whl"))
          (stage / "manifest.json").write_text(json.dumps({"wheel": wheels[-1]}), encoding="utf-8")

          api = HfApi()
          api.create_repo(
              repo_id="selimfirat/pysad-playground",
              repo_type="space",
              space_sdk="static",
              exist_ok=True,
          )
          api.upload_folder(
              repo_id="selimfirat/pysad-playground",
              folder_path=stage,
              repo_type="space",
              commit_message="Sync PySAD interactive playground",
              ignore_patterns=[".gitignore", "__pycache__/*", "*.pyc"],
              delete_patterns=["pysad-*.whl"],
          )
          PY
