name: ClusterFuzzLite

on:
  pull_request:
    paths:
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite.yml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
      - name: Run Fuzzers without artifact API pagination
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '120' || '30' }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/build-out:/out:ro" \
            gcr.io/oss-fuzz-base/base-builder-python@sha256:0aa4f12ee4e9a4aaa1e511b3ded82d662475150b82a786478f22d5c41adbacbd \
            /out/streaming_detectors_fuzzer "-max_total_time=${FUZZ_SECONDS}" -max_len=4096 -artifact_prefix=/tmp/
