[package]
name = "pysad_kernels"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Optional Rust kernels for PySAD streaming anomaly detection"
license = "BSD-3-Clause"
repository = "https://github.com/selimfirat/pysad"
publish = false

[lib]
name = "pysad_kernels"
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py311"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
