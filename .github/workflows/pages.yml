name: deploy pages

# Builds JupyterLite (at /) and the PySAD interactive playground (at /playground/)
# in one artifact so neither deployment overwrites the other on GitHub Pages.
on:
  push:
    branches: [master]
    paths:
      - "pysad/**"
      - "examples/**"
      - "spaces/playground/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: pages
          prune-cache: true
      - name: Build JupyterLite
        # The pins live in the jupyterlite dependency group, so Dependabot bumps them with
        # the existing weekly schedule and cooldown.
        run: |
          uv pip install --system --group jupyterlite
          jupyter lite build --contents examples --output-dir _site
      - name: Build playground bundle
        run: |
          stage="_site/playground"
          mkdir -p "$stage/data/nab"
          cp spaces/playground/index.html spaces/playground/worker.js spaces/playground/engine.py "$stage/"
          cp -r examples/data/nab/. "$stage/data/nab/"
          cp examples/data/arrhythmia.mat "$stage/data/arrhythmia.mat"
          uv build --wheel --out-dir "$stage"
          uv run --no-project --with "$stage"/pysad-*.whl python - <<'PY'
          import json
          import sys
          from pathlib import Path

          stage = Path("_site/playground")
          sys.path.insert(0, str(stage))
          import engine

          wheels = sorted(p.name for p in stage.glob("pysad-*.whl"))
          (stage / "manifest.json").write_text(json.dumps({"wheel": wheels[-1]}), encoding="utf-8")
          (stage / "initial_snapshot.json").write_text(
              engine.build_initial_snapshot_json(),
              encoding="utf-8",
          )
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
