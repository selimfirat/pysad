name: scorecard

# Runs the OpenSSF Scorecard supply-chain checks (pinned dependencies, token permissions,
# branch protection, dangerous workflows, ...) and publishes the results to
# https://scorecard.dev/viewer/?uri=github.com/selimfirat/pysad and the Security tab.
on:
  push:
    branches: [master]
  schedule:
    # Weekly on Tuesdays at 06:23 UTC.
    - cron: "23 6 * * 2"
  # Re-scores when branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF results to code scanning.
      security-events: write
      # Publish the results with the OIDC token so the badge and viewer update.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
        with:
          sarif_file: results.sarif
