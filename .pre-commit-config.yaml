# Linters and formatters for the whole repository. Run them on every commit with
# `pre-commit install`, or on demand with `pre-commit run --all-files`.
#
# pre-commit.ci runs them on every pull request, pushes a commit with the fixes it can
# make, and bumps the pinned revisions below once a week.
ci:
  autofix_commit_msg: "style: apply pre-commit fixes"
  autoupdate_commit_msg: "ci: bump pre-commit hooks"
  autoupdate_schedule: weekly
  # These run in .github/workflows/lint-workflows.yml instead, where shellcheck is
  # installed for actionlint and zizmor gets a token for its online audits.
  skip: [actionlint, zizmor]

# Vendored KitNET reference implementation, kept as upstream wrote it, and the NAB files of the
# browser demo, kept byte for byte so that they match the checksums in pysad/utils/data.py.
exclude: ^(pysad/models/kitnet_model/|examples/data/nab/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      - id: sync-exports
        name: sync package __init__.py exports
        entry: python scripts/sync_exports.py
        language: python
        pass_filenames: false
        files: ^(pysad/|scripts/sync_exports\.py$)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c  # frozen: v2.4.1
    hooks:
      - id: mypy
        # Checks the whole package as [tool.mypy] in pyproject.toml configures it, so that
        # a change in one module can't break the types another module relies on.
        pass_filenames: false
        files: ^(pysad/|pyproject\.toml$)
        # NumPy 2.5's stubs use Python 3.12 syntax, which mypy rejects when it checks for
        # Python 3.10; 2.4 is the newest release that also installs on pre-commit.ci's 3.14.
        additional_dependencies: [numpy==2.4.6]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
