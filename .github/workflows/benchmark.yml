name: benchmark

# Runs the detectors that a pull request can change on the first 2,000 points of each dataset
# (--ci), once with the code of the base branch and once with the code of the pull request, on the
# same machine. The summary of each job lists the runs whose AUROC moved, and the job keeps both
# result files as an artifact. Each part of benchmark.py (--parts) runs in its own job. The full
# results in docs/benchmark/ come from full runs that the maintainers make.
on:
  pull_request:
    paths:
      - "pysad/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: [odds, univariate, drift, nab, shingles]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: uv pip install --system --group runtime -e .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pysad
          key: pysad-data-${{ hashFiles('pysad/utils/data.py') }}
      # Both runs use the benchmark.py of the pull request, so that only the code of pysad differs.
      - name: Run the base branch
        if: github.base_ref != ''
        env:
          BASE_REF: ${{ github.base_ref }}
          PART: ${{ matrix.part }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git worktree add ../base "origin/$BASE_REF"
          uv pip install --system --no-deps -e ../base
          python benchmarks/benchmark.py --ci base.csv --since "origin/$BASE_REF" --parts "$PART"
      - name: Run the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
          PART: ${{ matrix.part }}
        run: |
          uv pip install --system --no-deps -e .
          if [ -n "$BASE_REF" ]; then
            python benchmarks/benchmark.py --ci head.csv --since "origin/$BASE_REF" --parts "$PART" --compare base.csv
          else
            python benchmarks/benchmark.py --ci head.csv --parts "$PART"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-${{ matrix.part }}
          path: "*.csv"
          if-no-files-found: ignore
