name: scorecard

# Runs the OpenSSF Scorecard supply-chain checks (pinned dependencies, token permissions,
# branch protection, dangerous workflows, ...) and publishes the results to
# https://scorecard.dev/viewer/?uri=github.com/selimfirat/pysad and the Security tab.
on:
  push:
    branches: [master]
  schedule:
    # Weekly on Tuesdays at 06:23 UTC.
    - cron: "23 6 * * 2"
  # Re-scores when branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF results to code scanning.
      security-events: write
      # Publish the results with the OIDC token so the badge and viewer update.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
