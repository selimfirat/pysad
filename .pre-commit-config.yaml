# Linters and formatters for the whole repository. Run them on every commit with
# `pre-commit install`, or on demand with `pre-commit run --all-files`.
#
# pre-commit.ci runs them on every pull request, pushes a commit with the fixes it can
# make, and bumps the pinned revisions below once a week.
ci:
  autofix_commit_msg: "style: apply pre-commit fixes"
  autoupdate_commit_msg: "ci: bump pre-commit hooks"
  autoupdate_schedule: weekly
  # These run in .github/workflows/lint-workflows.yml instead, where shellcheck is
  # installed for actionlint and zizmor gets a token for its online audits.
  skip: [actionlint, zizmor]

# Vendored KitNET reference implementation, kept as upstream wrote it.
exclude: ^pysad/models/kitnet_model/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
