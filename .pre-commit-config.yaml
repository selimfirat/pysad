# Linters and formatters for the whole repository. Run them on every commit with
# `pre-commit install`, or on demand with `pre-commit run --all-files`.
#
# pre-commit.ci runs them on every pull request, pushes a commit with the fixes it can
# make, and bumps the pinned revisions below once a week.
ci:
  autofix_commit_msg: "style: apply pre-commit fixes"
  autoupdate_commit_msg: "ci: bump pre-commit hooks"
  autoupdate_schedule: weekly
  # These run in .github/workflows/lint-workflows.yml instead, where shellcheck is
  # installed for actionlint and zizmor gets a token for its online audits.
  skip: [actionlint, zizmor]

# Vendored KitNET reference implementation, kept as upstream wrote it.
exclude: ^pysad/models/kitnet_model/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b  # frozen: v2.4.0
    hooks:
      - id: mypy
        # Checks the whole package as [tool.mypy] in pyproject.toml configures it, so that
        # a change in one module can't break the types another module relies on.
        pass_filenames: false
        files: ^(pysad/|pyproject\.toml$)
        # NumPy 2.5's stubs use Python 3.12 syntax, which mypy rejects when it checks for
        # Python 3.10; 2.4 is the newest release that also installs on pre-commit.ci's 3.14.
        additional_dependencies: [numpy==2.4.6]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
