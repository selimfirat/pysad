name: docs

# Builds the Sphinx documentation the same way Read the Docs does (.readthedocs.yaml:
# Python 3.10, the runtime and docs dependency groups, docs/conf.py) so a broken docs build fails the
# release pull request instead of surfacing on Read the Docs after the merge.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a group per PR (so stale pushes get cancelled); every push gets its own group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    # Only release/vX.Y.Z pull requests, the same branches publish.yml tags and releases.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches build.tools.python in .readthedocs.yaml.
          python-version: "3.10"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        # Same dependency groups as python.install in .readthedocs.yaml. The package itself
        # is not installed; docs/conf.py puts the repository root on sys.path.
        run: uv pip install --system --group runtime --group docs
      - name: Build documentation
        # -W turns warnings into errors and --keep-going reports all of them in one run.
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Upload built documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
