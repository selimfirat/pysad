name: coverage

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the Qlty upload authenticate with OIDC instead of a stored token.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements-ci.txt
          pip install pytest pytest-cov
          pip install -e .
      - name: Test with coverage
        run: pytest --cov=pysad --cov-report=lcov
      - name: Run examples
        run: pytest -m examples
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
      - name: Upload to Qlty
        # Forked PRs get no OIDC token, so upload only from this repo.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          files: coverage.lcov
