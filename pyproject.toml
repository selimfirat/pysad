[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pysad"
dynamic = ["version"]
dependencies = [
  "numpy",
  "scikit-learn",
  "scipy",
  "statsmodels",
  "pyod>=3.6.2",
  "combo==0.1.3",
]
requires-python = ">=3.10"
authors = [
  {name = "Selim Firat Yilmaz", email = "yilmazselimfirat@gmail.com"},
]
maintainers = [
  {name = "Selim Firat Yilmaz", email = "yilmazselimfirat@gmail.com"}
]
description = "Streaming anomaly detection in Python: 16 online detectors (xStream, LODA, RS-Hash, Half-Space Trees, RRCF...) plus calibration and prequential evaluation for real-time data."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
keywords = [
  "outlier detection",
  "anomaly detection",
  "machine learning",
  "streaming",
  "online learning",
  "real-time",
  "incremental learning",
  "time series",
]
classifiers = [
        'Development Status :: 5 - Production/Stable',
        'Intended Audience :: Education',
        'Intended Audience :: Financial and Insurance Industry',
        'Intended Audience :: Developers',
        'Intended Audience :: Science/Research',
        'Intended Audience :: Information Technology',
        "Topic :: Scientific/Engineering",
        "Topic :: Scientific/Engineering :: Artificial Intelligence",
        "Topic :: Software Development",
        "License :: OSI Approved :: BSD License",
        'Operating System :: Unix',
        'Operating System :: MacOS',
        'Operating System :: Microsoft :: Windows',
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13"
    ]

[project.optional-dependencies]
rrcf = ["rrcf==0.4.4"]
slop = ["PyNomaly==0.4.0"]
xStream = ["mmh3==5.3.0"]
pandas = ["pandas"]
inqmad = ["jax>=0.6.1", "jaxlib>=0.6.1"]

[project.urls]
Homepage = "https://github.com/selimfirat/pysad"
Documentation = "https://pysad.readthedocs.io/"
Repository = "https://github.com/selimfirat/pysad.git"
"Bug Tracker" = "https://github.com/selimfirat/pysad/issues"
Changelog = "https://github.com/selimfirat/pysad/blob/master/CHANGES.txt"

[tool.setuptools.dynamic]
version = {attr = "pysad.version.__version__"}

# Ruff reads the target Python version from requires-python above.
[tool.ruff]
# Most of the existing code already fits in 100 columns.
line-length = 100
# Vendored KitNET reference implementation, kept as upstream wrote it.
extend-exclude = ["pysad/models/kitnet_model"]

[tool.ruff.lint]
select = [
  "E",       # pycodestyle errors
  "W",       # pycodestyle warnings
  "F",       # Pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "B",       # flake8-bugbear
  "NPY",     # NumPy-specific rules, including the NumPy 2.0 removals
  "PGH",     # no blanket noqa or type: ignore comments
  "PLE",     # Pylint errors
  "T10",     # leftover debugger breakpoints
  "RUF100",  # unused noqa comments
]
ignore = [
  # The formatter wraps code; long docstring and comment lines are allowed.
  "E501",
  # The models draw from NumPy's global random state on purpose, so that
  # pysad.utils.fix_seed makes them reproducible.
  "NPY002",
]

[tool.ruff.lint.per-file-ignores]
# __version__ is defined by exec-ing pysad/version.py.
"docs/conf.py" = ["F821"]
# The examples unpack (X, y) pairs from the streamers to show the API, even where y is unused.
"examples/**" = ["B007"]
# The warning filters have to be installed before the subpackages are imported.
"pysad/__init__.py" = ["E402"]
