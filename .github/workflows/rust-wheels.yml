name: Rust Wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built wheels to PyPI
        required: true
        default: false
        type: boolean
  release:
    types: [published]
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-wheels.yml"

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build ${{ matrix.artifact }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            rust-targets: x86_64-unknown-linux-gnu
            artifact: rust-wheels-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            rust-targets: aarch64-unknown-linux-gnu
            artifact: rust-wheels-linux-aarch64
          - os: macos-15-intel
            arch: universal2
            rust-targets: x86_64-apple-darwin aarch64-apple-darwin
            artifact: rust-wheels-macos-universal2
          - os: windows-latest
            arch: AMD64
            rust-targets: x86_64-pc-windows-msvc
            artifact: rust-wheels-windows-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@63fd63b352a9a8bdcc24791c9dbee952ee9a8abc # v3.3.0
        with:
          package-dir: rust
          output-dir: wheelhouse
        env:
          # Cargo enables abi3-py311 for Python 3.11 and later.
          CIBW_BUILD: cp311-*
          CIBW_SKIP: "*-win32 *-musllinux_*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_ALL: "rustup default stable && rustup target add ${{ matrix.rust-targets }}"
          CIBW_BEFORE_ALL_LINUX: "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable && . \"$HOME/.cargo/env\" && rustup target add ${{ matrix.rust-targets }}"
          CIBW_ENVIRONMENT: "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=10.12"
          CIBW_TEST_COMMAND: 'python -c "import pysad_kernels"'

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl

  test-wheels:
    name: Test wheels (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact: rust-wheels-linux-x86_64
          - os: macos-latest
            artifact: rust-wheels-macos-universal2
          - os: windows-latest
            artifact: rust-wheels-windows-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/

      - name: Install the built kernels and fast extra
        run: |
          python -m pip install --no-index --find-links wheelhouse pysad_kernels==0.1.0
          python -m pip install ".[fast]"

      - name: Test native kernels with a stream
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np

          import pysad_kernels
          from pysad.models import HalfSpaceTrees

          assert callable(pysad_kernels.half_space_trees_path)
          assert callable(pysad_kernels.rrcf_route_to_leaf)
          assert callable(pysad_kernels.rrcf_codisp_sum)

          detector = HalfSpaceTrees(
              feature_mins=np.zeros(2),
              feature_maxes=np.ones(2),
              window_size=4,
              num_trees=2,
              max_depth=2,
              random_state=0,
          )
          for point in np.random.RandomState(0).random_sample((12, 2)):
              score = detector.fit_score_partial(point)
              assert isinstance(score, float)
              assert np.isfinite(score)
          PY

  publish-rust:
    name: Publish Rust wheels to PyPI
    needs: [build-wheels, test-wheels]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi-kernels
      url: https://pypi.org/project/pysad-kernels/
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-wheels-*
          merge-multiple: true
          path: dist/

      - name: Show downloaded wheels
        run: ls -la dist/

      - name: Publish Rust package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
