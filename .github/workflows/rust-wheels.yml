name: Rust Wheels

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust/**"
      - "pysad/_kernels.py"
      - "pysad/models/loda.py"
      - "pysad/models/stream_km_plusplus.py"
      - "tests/test_loda_streamkm_kernels.py"
      - ".github/workflows/rust-wheels.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test-kernels:
    name: Compare native and NumPy outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip && python -m pip install --group test . maturin
      - name: Build and install kernels
        run: |
          maturin build --manifest-path rust/Cargo.toml --release --locked
          python -m pip install rust/target/wheels/*.whl
      - name: Run kernel and detector tests
        run: python -m pytest -q tests/test_loda_streamkm_kernels.py tests/test_rust_kernels.py tests/models/test_loda.py tests/models/test_stream_km_plusplus.py

  build-wheels:
    name: Build wheels with cibuildwheel
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BUILD: cp311-*
          CIBW_SKIP: "*-win32 *-musllinux_*"
          CIBW_ARCHS: "auto"
          CIBW_BEFORE_ALL: "rustup default stable && rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-apple-darwin aarch64-apple-darwin"
          CIBW_ENVIRONMENT: "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          CIBW_PROJECT_DIR: "rust"
          CIBW_MACOS_DEFAULT_ARCH: "universal2"

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-wheels
          path: rust/target/wheels/*.whl

  publish-rust:
    name: Publish Rust wheels to PyPI
    needs: build-wheels
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-wheels
          path: dist/

      - name: Show downloaded wheels
        run: ls -la dist/

      - name: Publish Rust package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
