name: examples

on:
  push:
    branches: [master]
    paths:
      - "pysad/**"
      - "examples/**"
      - "tests/test_examples.py"
      - "pyproject.toml"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "pysad/**"
      - "examples/**"
      - "tests/test_examples.py"
      - "pyproject.toml"
      - ".github/workflows/examples.yml"

permissions:
  contents: read

concurrency:
  # PR runs share a group per PR (so stale pushes get cancelled); every push gets its own group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: |
          # uv prefers wheels by default, matching pip's --prefer-binary.
          uv pip install --system --group runtime --group test -e .
      - name: Run examples
        run: pytest -m examples -n auto
