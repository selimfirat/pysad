name: benchmark

# Reruns the detectors that a pull request can change and fails if their results differ from
# docs/benchmark/. The select job picks the detectors from the changed files, with
# changed_detectors in benchmarks/benchmark.py. Each picked detector then runs in its own job,
# because all of them take more than 4 CPU-hours.
on:
  pull_request:
    paths:
      - "pysad/**"
      - "benchmarks/**"
      - "docs/benchmark/**"
      - "pyproject.toml"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      detectors: ${{ steps.select.outputs.detectors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: uv pip install --system --group runtime -e .
      - name: Pick the detectors
        id: select
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF"
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, "benchmarks")
          import benchmark
          base = os.environ["BASE_REF"]
          detectors = benchmark.changed_detectors(f"origin/{base}") if base else list(benchmark.DETECTORS)
          print("detectors=" + json.dumps(detectors))
          PY
          cat "$GITHUB_OUTPUT"

  benchmark:
    needs: select
    if: needs.select.outputs.detectors != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        detector: ${{ fromJSON(needs.select.outputs.detectors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: uv pip install --system --group runtime -e .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pysad
          key: pysad-data-${{ hashFiles('pysad/utils/data.py') }}
      - name: Compare with docs/benchmark/
        env:
          DETECTOR: ${{ matrix.detector }}
        run: python benchmarks/benchmark.py --check --detectors "$DETECTOR"
