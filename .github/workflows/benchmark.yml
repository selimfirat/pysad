name: benchmark

# Runs the detectors that a pull request can change on the first 2,000 points of each dataset
# (--ci), once with the code of the base branch and once with the code of the pull request, on the
# same machine. The summary of each job lists the runs whose AUROC moved, and the job keeps both
# result files as an artifact. Each part of benchmark.py (--parts) runs in its own job, except the
# multivariate detectors on NAB (nab and shingles), which only the full runs of the maintainers run.
# The full results in docs/benchmark/ come from these full runs.
on:
  pull_request:
    paths:
      - "pysad/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: benchmark-runtime
          prune-cache: true
      - name: Install dependencies
        run: uv pip install --system --group runtime -e .
      - name: Compute benchmark matrix
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            python benchmarks/benchmark.py --ci-plan "origin/$BASE_REF" > "$RUNNER_TEMP/plan.json"
          else
            python benchmarks/benchmark.py --ci-plan > "$RUNNER_TEMP/plan.json"
          fi
          python -c '
          import json, os
          from pathlib import Path
          plan = json.loads(Path(os.environ["RUNNER_TEMP"], "plan.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("has_jobs=" + ("true" if plan["has_jobs"] else "false") + "\n")
              f.write("matrix=" + json.dumps({"include": plan["include"]}, separators=(",", ":")) + "\n")
          '

  benchmark:
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: benchmark-runtime
          prune-cache: true
      - name: Install dependencies
        run: uv pip install --system --group runtime -e .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pysad
          key: pysad-data-${{ hashFiles('pysad/utils/data.py', 'pysad/utils/_datasets.py') }}
          restore-keys: pysad-data-
      - name: Cache base branch benchmark
        id: cache-base
        if: matrix.has_base == true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base.csv
          key: benchmark-base-${{ matrix.part }}-${{ matrix.base_hash }}
      # Both runs use the benchmark.py of the pull request, so that only the code of pysad differs.
      - name: Run the base branch
        if: matrix.has_base == true && steps.cache-base.outputs.cache-hit != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          PART: ${{ matrix.part }}
          DETECTORS: ${{ matrix.shard }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git worktree add ../base "origin/$BASE_REF"
          uv pip install --system --no-deps -e ../base
          python benchmarks/benchmark.py --ci base.csv --parts "$PART" --detectors "$DETECTORS" --ignore-unknown
      - name: Run the pull request
        env:
          PART: ${{ matrix.part }}
          DETECTORS: ${{ matrix.shard }}
        run: |
          if [ -d ../base ]; then
            uv pip install --system --no-deps -e .
          fi
          if [ -f base.csv ]; then
            python benchmarks/benchmark.py --ci head.csv --parts "$PART" --detectors "$DETECTORS" --compare base.csv
          else
            python benchmarks/benchmark.py --ci head.csv --parts "$PART" --detectors "$DETECTORS"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-${{ matrix.part }}-${{ matrix.shard_id }}
          path: "*.csv"
          if-no-files-found: ignore
