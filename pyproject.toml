[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pysad"
dynamic = ["version"]
# The lowest-versions job resolves the lowest versions that the test dependencies allow.
# The SciPy and scikit-learn floors support NumPy 2.
# These floors prevent NumPy 2 from loading older builds compiled for NumPy 1.
dependencies = [
  "numpy>=1.23",
  "scikit-learn>=1.4.2",
  "scipy>=1.13.0",
]
requires-python = ">=3.11"
authors = [
  {name = "Selim Firat Yilmaz", email = "yilmazselimfirat@gmail.com"},
]
maintainers = [
  {name = "Selim Firat Yilmaz", email = "yilmazselimfirat@gmail.com"}
]
description = "Streaming anomaly detection in Python: 50+ online multivariate and univariate detectors (LODA, RRCF, Half-Space Trees, xStream, DAMP, SAND) with calibrated alerts, drift handling, and prequential evaluation."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
keywords = [
  "outlier detection",
  "anomaly detection",
  "machine learning",
  "streaming",
  "online learning",
  "real-time",
  "incremental learning",
  "time series",
  "concept drift",
  "conformal prediction",
  "prequential evaluation",
  "rrcf",
  "half-space trees",
  "loda",
  "spot",
]
classifiers = [
        'Development Status :: 5 - Production/Stable',
        'Intended Audience :: Education',
        'Intended Audience :: Financial and Insurance Industry',
        'Intended Audience :: Developers',
        'Intended Audience :: Science/Research',
        'Intended Audience :: Information Technology',
        "Topic :: Scientific/Engineering",
        "Topic :: Scientific/Engineering :: Artificial Intelligence",
        "Topic :: Software Development",
        "License :: OSI Approved :: BSD License",
        'Operating System :: Unix',
        'Operating System :: MacOS',
        'Operating System :: Microsoft :: Windows',
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14"
    ]

[project.urls]
Homepage = "https://github.com/selimfirat/pysad"
Documentation = "https://pysad.readthedocs.io/"
Playground = "https://huggingface.co/spaces/selimfirat/pysad-playground"
"Live Demo" = "https://selimfirat.github.io/pysad/lab/index.html?path=nyc_taxi_alerts.ipynb"
Benchmarks = "https://pysad.readthedocs.io/en/stable/benchmark.html"
Repository = "https://github.com/selimfirat/pysad.git"
"Bug Tracker" = "https://github.com/selimfirat/pysad/issues"
Discussions = "https://github.com/selimfirat/pysad/discussions"
Changelog = "https://github.com/selimfirat/pysad/releases"

[project.optional-dependencies]
mcp = ["mcp>=1.26.0,<2"]
# fast = ["pysad_kernels>=0.1.0"]  # Enable after pysad_kernels 0.1.0 is published on PyPI

[project.scripts]
pysad-live = "pysad.live.cli:main"
pysad-mcp = "pysad.mcp.server:main"

# PEP 735 dependency groups. The runtime dependencies use ranges in [project]; these
# groups pin what CI, Read the Docs and contributors install, and Dependabot bumps them.
# Install with `pip install -e . --group dev` (pip 25.1+) or `uv sync --group dev`.
[dependency-groups]
# Pinned runtime dependencies, so tests and docs run against known versions.
runtime = [
  "numpy==2.2.6",
  "scikit-learn==1.7.2",
  "scipy>=1.15.4",
  "setuptools>=84.0.0,<85.0.0",
]
mcp = [
  "mcp==1.30.0",
]
test = [
  # PandasStreamer takes DataFrames.
  "pandas==2.3.3",
  # examples/example_plot_stream.py draws with matplotlib.
  "matplotlib==3.11.2",
  # PolarsStreamer takes Polars DataFrames.
  "polars==2.1.0",
  # The reference that LocalOutlierProbability is tested against.
  "PyNomaly==0.4.0",
  # The batch detectors that the tests and examples run through pysad.integrations.
  "pyod>=3.6.2",
  # Security floor for pillow, a transitive dependency of pyod via matplotlib.
  "pillow>=12.3.0",
  # Adapters for River pipelines in pysad.integrations.
  "river==0.26.1",
  "hypothesis==6.168.5",
  # The reference that StreamhashProjector's NumPy MurmurHash3 is tested against.
  "mmh3==5.3.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
]
docs = [
  "sphinx==8.1.3",
  "furo==2025.12.19",
  "sphinxcontrib-bibtex==2.7.0",
  "sphinx-copybutton==0.5.2",
  "sphinx-llms-txt==0.7.1",
  # Security floor for idna, a transitive dependency via requests.
  "idna>=3.20",
]
lint = [
  "pre-commit==4.6.2",
]
# The libraries that benchmarks/compare.py compares PySAD with. CapyMOA needs Java, and
# scikit-learn 1.8 or newer.
compare = [
  "numpy==2.2.6",
  "scikit-learn==1.9.1",
  "scipy>=1.15.4",
  "pyod>=3.6.2",
  "pillow>=12.3.0",
  "river==0.26.1",
  "capymoa==0.15.1",
]
# The compared libraries that need NumPy 1. StreamAD needs statsmodels 0.13.5, which has no wheels
# for Python 3.12 or newer and fails to import with SciPy 1.16 or newer.
compare-numpy1 = [
  "scipy==1.15.3",
  "streamad==0.3.1",
  "alibi-detect==0.13.0",
]
# The packages that .github/workflows/pages.yml deploys to GitHub Pages, so the deploy
# job runs known versions and Dependabot bumps the pins with the one-week cooldown.
jupyterlite = [
  "jupyterlite-core==0.8.7",
  "jupyterlite-pyodide-kernel==0.8.7",
  "jupyter-server==2.21.1",
]
dev = [
  {include-group = "runtime"},
  {include-group = "mcp"},
  {include-group = "test"},
  {include-group = "docs"},
  {include-group = "lint"},
]

[tool.setuptools.dynamic]
version = {attr = "pysad.version.__version__"}

[tool.setuptools.packages.find]
include = ["pysad*"]

[tool.setuptools.package-data]
# PEP 561 marker: type checkers use pysad's inline type hints.
pysad = ["py.typed"]

[tool.uv]
# `uv sync` would otherwise add the dev group to whatever --group asks for; Read the Docs
# and CI name the groups they need explicitly.
default-groups = []
# The two compare groups pin different versions of NumPy and scikit-learn than the other groups.
conflicts = [
  [{group = "compare"}, {group = "compare-numpy1"}],
  [{group = "compare"}, {group = "runtime"}],
  [{group = "compare"}, {group = "dev"}],
  [{group = "compare-numpy1"}, {group = "runtime"}],
  [{group = "compare-numpy1"}, {group = "test"}],
  [{group = "compare-numpy1"}, {group = "dev"}],
]

[tool.uv.dependency-groups]
compare-numpy1 = {requires-python = "<3.12"}

[tool.pytest.ini_options]
addopts = ["--verbose", "-m", "not examples"]
markers = [
  "examples: runs the scripts in examples/ end to end (slow, run with -m examples)",
]

[tool.coverage.run]
source = ["pysad"]

# Ruff reads the target Python version from requires-python above.
[tool.ruff]
# Most of the existing code already fits in 100 columns.
line-length = 100

[tool.ruff.lint]
select = [
  "E",       # pycodestyle errors
  "W",       # pycodestyle warnings
  "F",       # Pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "B",       # flake8-bugbear
  "NPY",     # NumPy-specific rules, including the NumPy 2.0 removals
  "PGH",     # no blanket noqa or type: ignore comments
  "PLE",     # Pylint errors
  "T10",     # leftover debugger breakpoints
  "RUF100",  # unused noqa comments
]
ignore = [
  # The formatter wraps code; long docstring and comment lines are allowed.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# __version__ is defined by exec-ing pysad/version.py.
"docs/conf.py" = ["F821"]
# The examples unpack (X, y) pairs from the streamers to show the API, even where y is unused.
# They also seed NumPy's global random state, as users of pysad.utils.fix_seed do.
"examples/**" = ["B007", "NPY002"]
# The tests seed NumPy's global random state with pysad.utils.fix_seed, which random_state=None draws from.
"tests/**" = ["NPY002"]

[tool.mypy]
python_version = "3.11"
files = ["pysad"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = [
    "pysad.core.*",
    "pysad.models.absad",
    "pysad.models.adems",
    "pysad.models.anyout",
    "pysad.models.approx_storm",
    "pysad.models.baselines",
    "pysad.models.change_finder",
    "pysad.models.cost_sensitive_stream",
    "pysad.models.cpod",
    "pysad.models.d3",
    "pysad.models.drift_adaptive_detector",
    "pysad.models.feedback_hst",
    "pysad.models.half_space_trees",
    "pysad.models.htm.htm",
    "pysad.models.holt_winters",
    "pysad.models.idks",
    "pysad.models.iforest_asd",
    "pysad.models.inqmad",
    "pysad.models.kelos",
    "pysad.models.kitnet",
    "pysad.models.knn_cad",
    "pysad.models.loda",
    "pysad.models.local_polynomial",
    "pysad.models.loop",
    "pysad.models.matrix_profile",
    "pysad.models.mcod",
    "pysad.models.median_absolute_deviation",
    "pysad.models.midas",
    "pysad.models.milof",
    "pysad.models.model_ensemble",
    "pysad.models.online_isolation_forest",
    "pysad.models.online_one_class_svm",
    "pysad.models.pcb_isolation_forest",
    "pysad.models.relative_entropy",
    "pysad.models.robust_random_cut_forest",
    "pysad.models.rs_forest",
    "pysad.models.rs_hash",
    "pysad.models.sand",
    "pysad.models.sdostream",
    "pysad.models.stream_km_plusplus",
    "pysad.models.streaming_autoregressive",
    "pysad.evaluation.*",
    "pysad.evaluation.metrics",
    "pysad.evaluation.prequential",
    "pysad.evaluation.rolling_metric",
    "pysad.evaluation.windowed_metric",
    "pysad.integrations",
    "pysad.integrations.*",
    "pysad.statistics.*",
    "pysad.statistics.basic",
    "pysad.statistics.drift",
    "pysad.statistics.exponential_moving_average_meter",
    "pysad.statistics.exponential_moving_variance_meter",
    "pysad.statistics.quantiles",
    "pysad.statistics.relative_error_quantile_meter",
    "pysad.statistics.running_statistic",
    "pysad.transform",
    "pysad.transform.*",
    "pysad.utils.window",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
implicit_reexport = false
warn_unused_ignores = false

# Dependencies without type hints or stubs.
[[tool.mypy.overrides]]
module = ["pandas.*", "polars.*", "river.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
