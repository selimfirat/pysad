[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pysad"
dynamic = ["version"]
dependencies = [
  "numpy",
  "scikit-learn",
  "scipy",
  "statsmodels",
  "pyod>=3.6.2",
]
requires-python = ">=3.10"
authors = [
  {name = "Selim Firat Yilmaz", email = "yilmazselimfirat@gmail.com"},
]
maintainers = [
  {name = "Selim Firat Yilmaz", email = "yilmazselimfirat@gmail.com"}
]
description = "Streaming anomaly detection in Python: 16 online detectors (xStream, LODA, RS-Hash, Half-Space Trees, RRCF...) plus calibration and prequential evaluation for real-time data."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
keywords = [
  "outlier detection",
  "anomaly detection",
  "machine learning",
  "streaming",
  "online learning",
  "real-time",
  "incremental learning",
  "time series",
]
classifiers = [
        'Development Status :: 5 - Production/Stable',
        'Intended Audience :: Education',
        'Intended Audience :: Financial and Insurance Industry',
        'Intended Audience :: Developers',
        'Intended Audience :: Science/Research',
        'Intended Audience :: Information Technology',
        "Topic :: Scientific/Engineering",
        "Topic :: Scientific/Engineering :: Artificial Intelligence",
        "Topic :: Software Development",
        "License :: OSI Approved :: BSD License",
        'Operating System :: Unix',
        'Operating System :: MacOS',
        'Operating System :: Microsoft :: Windows',
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13"
    ]

[project.optional-dependencies]
rrcf = ["rrcf==0.4.4"]
slop = ["PyNomaly==0.4.0"]
xStream = ["mmh3==5.3.0"]
pandas = ["pandas"]
inqmad = ["jax>=0.6.1", "jaxlib>=0.6.1"]

[project.urls]
Homepage = "https://github.com/selimfirat/pysad"
Documentation = "https://pysad.readthedocs.io/"
Repository = "https://github.com/selimfirat/pysad.git"
"Bug Tracker" = "https://github.com/selimfirat/pysad/issues"
Changelog = "https://github.com/selimfirat/pysad/blob/master/CHANGES.txt"

# PEP 735 dependency groups. The runtime dependencies stay unpinned in [project]; these
# groups pin what CI, Read the Docs and contributors install, and Dependabot bumps them.
# Install with `pip install -e . --group dev` (pip 25.1+) or `uv sync --group dev`.
[dependency-groups]
# Pinned runtime dependencies and every optional extra, so tests and docs cover all models.
runtime = [
  "numpy==2.2.6",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "statsmodels==0.15.0",
  "pyod>=3.6.2",
  "pandas==2.3.3",
  "rrcf==0.4.4",
  "PyNomaly==0.4.0",
  "mmh3==5.3.0",
  "jax>=0.6.1",
  "jaxlib>=0.6.1",
  "setuptools>=84.0.0,<85.0.0",
  # Security floor for pillow, a transitive dependency via matplotlib.
  "pillow>=12.3.0",
]
test = [
  "hypothesis==6.168.3",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
]
docs = [
  "sphinx==8.1.3",
  "sphinx-rtd-theme==3.1.0",
  "sphinxcontrib-fulltoc==1.2.0",
  "sphinxcontrib-bibtex==2.7.0",
  "sphinx-copybutton==0.5.2",
  # Security floor for idna, a transitive dependency via requests.
  "idna>=3.20",
]
lint = [
  "pre-commit==4.6.2",
]
dev = [
  {include-group = "runtime"},
  {include-group = "test"},
  {include-group = "docs"},
  {include-group = "lint"},
]

[tool.setuptools.dynamic]
version = {attr = "pysad.version.__version__"}

[tool.uv]
# `uv sync` would otherwise add the dev group to whatever --group asks for; Read the Docs
# and CI name the groups they need explicitly.
default-groups = []

[tool.pytest.ini_options]
addopts = ["--verbose", "-m", "not examples"]
markers = [
  "examples: runs the scripts in examples/ end to end (slow, run with -m examples)",
]

[tool.coverage.run]
source = ["pysad"]
# Vendored KitNET reference implementation, kept as upstream wrote it.
omit = ["pysad/models/kitnet_model/*"]

# Ruff reads the target Python version from requires-python above.
[tool.ruff]
# Most of the existing code already fits in 100 columns.
line-length = 100
# Vendored KitNET reference implementation, kept as upstream wrote it.
extend-exclude = ["pysad/models/kitnet_model"]

[tool.ruff.lint]
select = [
  "E",       # pycodestyle errors
  "W",       # pycodestyle warnings
  "F",       # Pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "B",       # flake8-bugbear
  "NPY",     # NumPy-specific rules, including the NumPy 2.0 removals
  "PGH",     # no blanket noqa or type: ignore comments
  "PLE",     # Pylint errors
  "T10",     # leftover debugger breakpoints
  "RUF100",  # unused noqa comments
]
ignore = [
  # The formatter wraps code; long docstring and comment lines are allowed.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# __version__ is defined by exec-ing pysad/version.py.
"docs/conf.py" = ["F821"]
# The examples unpack (X, y) pairs from the streamers to show the API, even where y is unused.
# They also seed NumPy's global random state, as users of pysad.utils.fix_seed do.
"examples/**" = ["B007", "NPY002"]
# The tests seed NumPy's global random state with pysad.utils.fix_seed, which random_state=None draws from.
"tests/**" = ["NPY002"]
