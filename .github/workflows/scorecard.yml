name: scorecard

# Runs the OpenSSF Scorecard supply-chain checks (pinned dependencies, token permissions,
# branch protection, dangerous workflows, ...) and publishes the results to
# https://scorecard.dev/viewer/?uri=github.com/selimfirat/pysad and the Security tab.
on:
  push:
    branches: [master]
  schedule:
    # Weekly on Tuesdays at 06:23 UTC.
    - cron: "23 6 * * 2"
  # Re-scores when branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF results to code scanning.
      security-events: write
      # Publish the results with the OIDC token so the badge and viewer update.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
